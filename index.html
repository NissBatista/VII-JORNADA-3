<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sorteio — VII Jornada de Administração UFPI</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>VII JORNADA DE ADMINISTRAÇÃO - UFPI</h1>
  <p>Sorteio ao vivo · escaneie o QR Code e receba seu número</p>
</header>

<main class="palco">
  <section class="qr-box">
    <div id="qrcode"></div>
    <p id="qr-legenda">Aponte a câmera do celular</p>
  </section>

  <section class="painel">
    <div class="relogio" id="relogio">03:00</div>
    <div class="contador"><b id="contador">0</b> participantes</div>

    <div class="login" id="login">
      <input id="email" type="email" placeholder="E-mail do organizador" autocomplete="username">
      <input id="senha" type="password" placeholder="Senha" autocomplete="current-password">
      <button id="btn-entrar">Entrar</button>
    </div>

    <div class="controles" id="controles" hidden>
      <button id="btn-iniciar">Iniciar Captação</button>
      <button id="btn-reiniciar" class="sec">Reiniciar</button>
    </div>

    <div class="chips" id="chips" aria-live="polite"></div>
  </section>
</main>

<div class="vencedor" id="vencedor">
  <small id="v-titulo">Sorteando...</small>
  <div class="num" id="v-num">---</div>
  <button id="btn-fechar" class="sec" hidden>Fechar</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="firebase-config.js"></script>
<script src="telao.js"></script>
</body>
</html>
